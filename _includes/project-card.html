<a class="project-card project-card--{{ include.project.color | default: 'peach' }}" href="{{ include.project.url | relative_url }}">
  <div class="project-card__thumb">
    {%- if include.project.image -%}
      <img src="{{ include.project.image | relative_url }}" alt="" loading="lazy">
    {%- else -%}
      <span class="project-card__badge">{% include project-icon.html name=include.project.icon %}</span>
    {%- endif -%}
  </div>
  <div class="project-card__caption">
    <h2 class="project-card__title">{{ include.project.title }}</h2>
    {%- if include.project.summary %}<p class="project-card__summary">{{ include.project.summary }}</p>{% endif %}
  </div>
</a>
